<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>बिक्री आम्दानी (Multi-Product)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:"Noto Sans Devanagari","Kalimati",system-ui;background:#f4f7f6}
.container{max-width:1200px;margin:20px auto;background:#fff;padding:25px;border-radius:10px}
h1,h2{color:#2e7d32;text-align:center}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
th{background:#eef5ee}
input{width:100%;padding:5px}
button{padding:6px 10px;background:#2e7d32;color:#fff;border:none;border-radius:4px;cursor:pointer}
.btn-del{background:#c62828}
.btn-edit{background:#1565c0}
a{text-decoration:none;color:#2e7d32}
@media print{button,a{display:none}}
</style>
</head>

<body>
<div class="container">

<a href="index.html">⬅ Dashboard</a>
<h1>🐷 बिक्री आम्दानी (Multi-Product)</h1>

<!-- ================= AUTO PRODUCTS ================= -->
<h2>🔄 अटोमेटिक बिक्री (Production बाट)</h2>
<table>
<tr>
<th>Product</th><th>संख्या</th><th>औसत तौल (kg)</th><th>रु / kg</th><th>आम्दानी</th>
</tr>
<tr>
<td>पाठापाठी (९–१२ महिना)</td>
<td id="autoYoungQty">–</td>
<td><input id="wYoung" value="80"></td>
<td rowspan="2"><input id="priceKg" value="450"></td>
<td id="incomeYoung">–</td>
</tr>
<tr>
<td>बयस्क (प्रतिस्थापन)</td>
<td id="autoAdultQty">–</td>
<td><input id="wAdult" value="100"></td>
<td id="incomeAdult">–</td>
</tr>
</table>

<!-- ================= MANUAL PRODUCTS ================= -->
<h2>➕ Other / Manual Products</h2>

<table id="manualTable">
<tr>
<th>Product Name</th>
<th>Qty</th>
<th>Avg kg</th>
<th>रु / kg</th>
<th>Action</th>
</tr>
</table>

<button onclick="addProduct()">➕ Add Product</button>
<button onclick="calculate()">📊 Calculate Total Sales</button>

<h2>📌 कुल बिक्री आम्दानी</h2>
<table>
<tr><th>Total Income</th><th id="grandTotal">–</th></tr>
</table>

</div>

<script>
const prod = JSON.parse(localStorage.getItem("productionSalesPlan")||"{}");
let products = [];
let pid = 0;

function n(v){ return parseFloat(v)||0; }

/* ===== Load Auto Products ===== */
function loadAuto(){
  if(!prod.adult) return;

  const adult = prod.adult;
  const alive = adult*(prod.breedRate/100)*prod.kids*((100-prod.death)/100);
  const male = alive*(prod.maleRate/100);
  const female = alive - male;

  const keepF = female*(prod.keepFemale/100);
  const keepM = male*(prod.keepMale/100);

  autoYoungQty.innerText = Math.round(alive - keepF - keepM);
  autoAdultQty.innerText = Math.round(adult*(prod.replacement/100));
}

/* ===== Manual Product CRUD ===== */
function addProduct(){
  const p = {id:pid++, name:"", qty:0, kg:0, price:0, edit:true};
  products.push(p);
  renderProducts();
}

function editProduct(id){
  products.find(p=>p.id===id).edit = true;
  renderProducts();
}

function saveProduct(id){
  const r = document.getElementById("row"+id);
  const p = products.find(p=>p.id===id);

  p.name  = r.cells[0].children[0].value;
  p.qty   = n(r.cells[1].children[0].value);
  p.kg    = n(r.cells[2].children[0].value);
  p.price = n(r.cells[3].children[0].value);
  p.edit  = false;

  renderProducts();
}

function deleteProduct(id){
  products = products.filter(p=>p.id!==id);
  renderProducts();
}

/* ===== Render Manual Table ===== */
function renderProducts(){
  manualTable.innerHTML = `
  <tr>
    <th>Product Name</th><th>Qty</th><th>Avg kg</th><th>रु / kg</th><th>Action</th>
  </tr>`;

  products.forEach(p=>{
    manualTable.innerHTML += `
    <tr id="row${p.id}">
      <td>${p.edit?`<input value="${p.name}">`:p.name}</td>
      <td>${p.edit?`<input value="${p.qty}">`:p.qty}</td>
      <td>${p.edit?`<input value="${p.kg}">`:p.kg}</td>
      <td>${p.edit?`<input value="${p.price}">`:p.price}</td>
      <td>
        ${p.edit
          ? `<button onclick="saveProduct(${p.id})">💾</button>`
          : `<button class="btn-edit" onclick="editProduct(${p.id})">✏️</button>`
        }
        <button class="btn-del" onclick="deleteProduct(${p.id})">❌</button>
      </td>
    </tr>`;
  });
}

/* ===== Calculate Sales ===== */
function calculate(){
  let total = 0;
  const price = n(priceKg.value);

  const yq = n(autoYoungQty.innerText);
  const aq = n(autoAdultQty.innerText);

  const iy = yq*n(wYoung.value)*price;
  const ia = aq*n(wAdult.value)*price;

  incomeYoung.innerText = iy.toLocaleString();
  incomeAdult.innerText = ia.toLocaleString();

  total += iy + ia;

  products.forEach(p=>{
    total += p.qty*p.kg*p.price;
  });

  grandTotal.innerText = "रु " + total.toLocaleString();
}

loadAuto();
</script>

</body>
</html>
