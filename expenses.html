<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Expenses | FarmerBase BP Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:system-ui;background:#f4f6f8;margin:0}
header{background:#2e7d32;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:18px}
.container{max-width:1100px;margin:auto;padding:16px;padding-bottom:140px}
.card{background:#fff;border-radius:10px;padding:16px;margin-bottom:16px}
h2{margin-top:0}
label{font-weight:600;display:block;margin-top:10px}
input,select,textarea{width:100%;padding:8px;margin-top:6px;border:1px solid #ccc;border-radius:6px}
textarea{min-height:60px}
button{cursor:pointer}
.btn{background:#2e7d32;color:#fff;border:none;padding:8px 12px;border-radius:6px}
.btn-red{background:#c62828;color:#fff;border:none;padding:6px 10px;border-radius:6px}
.small{font-size:13px;color:#555}
.nav{display:flex;justify-content:space-between;margin:12px 0}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ccc;padding:6px;font-size:14px}
th{background:#f1f8f4}
footer{position:fixed;left:0;right:0;bottom:0;background:#f1f8f4;border-top:1px solid #ccc;padding:8px 12px;display:flex;justify-content:space-between}
</style>
</head>

<body>

<header>
  <h1>Expenses</h1>
  <button onclick="location.href='short-info.html'">🏠 Home</button>
</header>

<div class="container">

<div class="nav">
  <button onclick="location.href='production.html'">⬅️ Production</button>
  <button onclick="location.href='capital-source.html'">➡️ Capital</button>
</div>

<div class="card small">
  <b>संस्थाको नाम:</b> <span id="bizName"></span><br>
  <b>परियोजनाको नाम:</b> <span id="projectName"></span>
</div>

<!-- SUBHEAD -->
<div class="card">
<h2>🗂️ खर्च उपशीर्षक</h2>

<label>खर्चको प्रकार</label>
<select id="subType">
  <option value="चालु">चालु खर्च</option>
  <option value="स्थिर">स्थिर खर्च</option>
</select>

<label>नयाँ उपशीर्षक</label>
<input id="subInput">

<button class="btn" onclick="addSubHead()">➕ थप्नुहोस्</button>
<div id="subList" class="small"></div>
</div>

<!-- EXPENSE FORM -->
<div class="card">
<h2>➕ खर्च विवरण</h2>

<label>खर्चको प्रकार</label>
<select id="expType">
  <option value="चालु">चालु</option>
  <option value="स्थिर">स्थिर</option>
</select>

<label>उपशीर्षक</label>
<select id="subHeadSelect"></select>

<label>खर्चको नाम</label>
<input id="itemName">

<label>इकाई</label>
<input id="unit">

<label>परिमाण</label>
<input type="number" id="qty">

<label>दर</label>
<input type="number" id="rate">

<label>कुन उत्पादनमा खर्च?</label>
<div id="productChecks" class="small"></div>

<label>कैफियत</label>
<textarea id="note"></textarea>

<button class="btn" onclick="addExpense()">💾 खर्च थप्नुहोस्</button>
</div>

<!-- LIST -->
<div class="card">
<h2>📄 खर्च सूची</h2>
<div id="listBox"></div>
</div>

</div>

<footer>
<span class="small">Expenses</span>
<span class="small">FarmerBase BP Engine</span>
</footer>

<script>
/* ===== IDENTITY ===== */
const login=JSON.parse(localStorage.getItem("fb_login"))||{};
bizName.innerText=login.businessName||"-";
projectName.innerText=login.projectName||"-";

/* ===== PRODUCTS ===== */
const products=JSON.parse(localStorage.getItem("fb_products"))||[];

/* ===== CAPITAL SOURCES (READ ONLY) ===== */
const capitalSources=JSON.parse(localStorage.getItem("capitalSources"))||[];

/* ===== SUBHEADS ===== */
let subHeads=JSON.parse(localStorage.getItem("fb_expense_subheads"))||{"चालु":[],"स्थिर":[]};
function saveSubHeads(){
  localStorage.setItem("fb_expense_subheads",JSON.stringify(subHeads));
  renderSubHeads();renderSubDropdown();
}
function addSubHead(){
  const t=subType.value,v=subInput.value.trim();
  if(!v||subHeads[t].includes(v))return;
  subHeads[t].push(v);subInput.value="";saveSubHeads();
}
function renderSubHeads(){
  const t=subType.value;
  subList.innerHTML=subHeads[t].map((s,i)=>`
    <div>${s}
    <button class="btn-red" onclick="delSubHead('${t}',${i})">x</button></div>`).join("")||"उपशीर्षक छैन";
}
function delSubHead(t,i){subHeads[t].splice(i,1);saveSubHeads();}
subType.onchange=renderSubHeads;renderSubHeads();

function renderSubDropdown(){
  const t=expType.value;
  subHeadSelect.innerHTML="";
  (subHeads[t]||[]).forEach(s=>{
    const o=document.createElement("option");
    o.value=s;o.textContent=s;subHeadSelect.appendChild(o);
  });
}
expType.onchange=renderSubDropdown;renderSubDropdown();

/* ===== PRODUCT CHECKS ===== */
function renderProductChecks(sel=[]){
  productChecks.innerHTML="";
  products.forEach(p=>{
    productChecks.innerHTML+=`
    <label><input type="checkbox" value="${p.name}"
    ${sel.includes(p.name)?"checked":""}> ${p.name}</label><br>`;
  });
}
renderProductChecks();

/* ===== DATA ===== */
let expenses=JSON.parse(localStorage.getItem("fb_expenses"))||[];
let productCost=JSON.parse(localStorage.getItem("fb_product_cost"))||[];
let capitalUsage=JSON.parse(localStorage.getItem("fb_capital_usage"))||[];

/* ===== ADD EXPENSE ===== */
function addExpense(){
  const linked=[...productChecks.querySelectorAll("input:checked")].map(c=>c.value);
  const e={
    type:expType.value,
    sub:subHeadSelect.value,
    name:itemName.value.trim(),
    unit:unit.value.trim(),
    qty:+qty.value,
    rate:+rate.value,
    products:linked,
    note:note.value.trim()
  };
  if(!e.sub||!e.name||!e.qty||!e.rate){alert("सबै विवरण चाहिन्छ");return;}
  expenses.push(e);

  linked.forEach(p=>{
    const amt=e.qty*e.rate;
    productCost.push({product:p,amount:amt,type:e.type});

    /* CAPITAL SOURCE % USAGE */
    const totalCap=capitalSources.reduce((s,c)=>s+c.amount,0);
    capitalSources.forEach(c=>{
      capitalUsage.push({
        source:c.source,
        percent:((c.amount/totalCap)*100).toFixed(2),
        product:p,
        expense:e.sub,
        capitalType:e.type,
        amount:(amt*(c.amount/totalCap)).toFixed(2)
      });
    });
  });

  localStorage.setItem("fb_expenses",JSON.stringify(expenses));
  localStorage.setItem("fb_product_cost",JSON.stringify(productCost));
  localStorage.setItem("fb_capital_usage",JSON.stringify(capitalUsage));
  clearForm();render();
}

/* ===== RENDER ===== */
function render(){
  if(!expenses.length){listBox.innerHTML="खर्च छैन";return;}
  let h="<table><tr><th>प्रकार</th><th>उपशीर्षक</th><th>नाम</th><th>रकम</th><th>उत्पादन</th></tr>";
  expenses.forEach(e=>{
    h+=`<tr><td>${e.type}</td><td>${e.sub}</td><td>${e.name}</td>
    <td>${e.qty*e.rate}</td><td>${e.products.join(",")}</td></tr>`;
  });
  listBox.innerHTML=h+"</table>";
}
function clearForm(){
  itemName.value="";unit.value="";qty.value="";rate.value="";note.value="";
  renderProductChecks();
}
render();
</script>

</body>
</html>
