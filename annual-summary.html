<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>वार्षिक आम्दानी–खर्च समरी</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:"Noto Sans Devanagari","Kalimati",system-ui;background:#fff}
.container{max-width:900px;margin:20px auto}
h1,h2{text-align:center;color:#2e7d32}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #666;padding:6px}
th{background:#eef5ee}
.right{text-align:right}
.summary{background:#f1f8f4;font-weight:bold}
@media print{.no-print{display:none}}
</style>
</head>

<body>
<div class="container">

<h1>🐷 वार्षिक आम्दानी–खर्च समरी</h1>

<h2>१) बिक्री आम्दानी</h2>
<table>
<tr><th>स्रोत</th><th class="right">रकम (रु)</th></tr>
<tr><td>पाठापाठी बिक्री (९–१२ महिना)</td><td id="incYoung" class="right"></td></tr>
<tr><td>बयस्क बिक्री (प्रतिस्थापन)</td><td id="incAdult" class="right"></td></tr>
<tr class="summary"><td>कुल आम्दानी</td><td id="incTotal" class="right"></td></tr>
</table>

<h2>२) वार्षिक खर्च</h2>
<table>
<tr><th>खर्च शीर्षक</th><th class="right">रकम (रु)</th></tr>
<tr><td>दाना खर्च</td><td id="expFeed" class="right"></td></tr>
<tr><td>भिटामिन खर्च</td><td id="expVit" class="right"></td></tr>
<tr><td>औषधि खर्च</td><td id="expMed" class="right"></td></tr>
<tr class="summary"><td>कुल खर्च</td><td id="expTotal" class="right"></td></tr>
</table>

<h2>३) वार्षिक नतिजा</h2>
<table>
<tr class="summary">
<td>कुल आम्दानी − कुल खर्च</td>
<td id="net" class="right"></td>
</tr>
</table>

<div class="no-print" style="text-align:center;margin-top:15px">
<button onclick="window.print()">🖨️ Print / Save PDF</button>
</div>

</div>

<script>
/* ================== LOAD PRODUCTION ================== */
const p = JSON.parse(localStorage.getItem("productionSalesPlan")||"{}");
if(!p.adult){ alert("पहिले production.html मा Save & Calculate गर्नुहोस्"); }

/* ================== COMMON ================== */
const adult = p.adult || 0;
const alive = adult*(p.breedRate/100)*p.kids*((100-p.death)/100);
const male  = alive*(p.maleRate/100);
const female= alive-male;
const keepF = female*(p.keepFemale/100);
const keepM = male*(p.keepMale/100);

const sellYoung = alive - keepF - keepM;
const sellAdult = adult*(p.replacement/100);

/* ================== SALES (EDITABLE DEFAULTS) ================== */
const wYoung = Number(localStorage.getItem("wYoung")||80);
const wAdult = Number(localStorage.getItem("wAdult")||100);
const priceKg= Number(localStorage.getItem("priceKg")||450);

const incYoung = sellYoung*wYoung*priceKg;
const incAdult = sellAdult*wAdult*priceKg;
const incTotal = incYoung+incAdult;

/* ================== EXPENSE (SAME LOGIC AS feed-expenses) ================== */
const feedPrice = Number(localStorage.getItem("feedPrice")||55);

// feed
const adultFeed = adult*3*365*feedPrice;
const youngFeed = alive*((1.5*150)+(2*90)+(3*125))*feedPrice;
const feedTotal = adultFeed+youngFeed;

// vitamin
const vitTotal = (adult*5 + alive*8)*365;

// medicine
const medTotal = adult*1500 + alive*2500;

const expTotal = feedTotal+vitTotal+medTotal;

/* ================== DISPLAY ================== */
const ru=v=>"रु "+Math.round(v).toLocaleString();
incYoungEl.textContent=ru(incYoung);
incAdultEl.textContent=ru(incAdult);
incTotalEl.textContent=ru(incTotal);

expFeedEl.textContent=ru(feedTotal);
expVitEl.textContent =ru(vitTotal);
expMedEl.textContent =ru(medTotal);
expTotalEl.textContent=ru(expTotal);

net.textContent=ru(incTotal-expTotal);

/* map */
function map(){
  incYoungEl=document.getElementById("incYoung");
  incAdultEl=document.getElementById("incAdult");
  incTotalEl=document.getElementById("incTotal");
  expFeedEl=document.getElementById("expFeed");
  expVitEl=document.getElementById("expVit");
  expMedEl=document.getElementById("expMed");
  expTotalEl=document.getElementById("expTotal");
  net=document.getElementById("net");
}
map();
</script>

</body>
</html>
