<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>वार्षिक आम्दानी तथा खर्च समरी</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  font-family:"Noto Sans Devanagari","Kalimati",system-ui;
  background:#fff;
  margin:0;
}
.page{
  max-width:1100px;
  margin:20px auto;
  padding:20px;
}
.header{
  text-align:center;
  border-bottom:2px solid #2e7d32;
  padding-bottom:8px;
  margin-bottom:12px;
}
.header h1{
  color:#2e7d32;
  margin:0;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
.section{
  border:1px solid #ccc;
  border-radius:8px;
  padding:12px;
}
.section h2{
  margin:0 0 6px 0;
  color:#2e7d32;
  font-size:17px;
  border-bottom:1px solid #ddd;
  padding-bottom:4px;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
th,td{
  padding:6px;
  border-bottom:1px dotted #bbb;
}
th{text-align:left}
td{text-align:right}
.group{
  background:#f1f8f4;
  font-weight:600;
}
.footer-note{
  text-align:center;
  font-size:12px;
  color:#555;
  margin-top:10px;
}
@media print{
  .no-print{display:none}
}
</style>
</head>

<body>
<div class="page">

<div class="header">
  <h1>🐷 वार्षिक आम्दानी तथा खर्च समरी</h1>
  <div style="font-size:13px;color:#555">
    (नाफा–घाटा गणना पछि थपिनेछ)
  </div>
</div>

<div class="grid">

<!-- LEFT COLUMN -->
<div class="section">
<h2>📈 बिक्री आम्दानी</h2>
<table>
<tr><th>पाठापाठी बिक्री (९–१२ महिना)</th><td id="incYoung"></td></tr>
<tr><th>बयस्क बिक्री (प्रतिस्थापन)</th><td id="incAdult"></td></tr>
<tr class="group"><th>कुल आम्दानी</th><td id="incTotal"></td></tr>
</table>
</div>

<!-- RIGHT COLUMN -->
<div class="section">
<h2>📉 खर्च विवरण</h2>
<table>
<tr class="group">
<th>खर्च</th>
<th>बयस्क</th>
<th>पाठापाठी</th>
<th>जम्मा</th>
</tr>

<tr>
<th>दाना</th>
<td id="feedAdult"></td>
<td id="feedYoung"></td>
<td id="feedTotal"></td>
</tr>

<tr>
<th>भिटामिन</th>
<td id="vitAdult"></td>
<td id="vitYoung"></td>
<td id="vitTotal"></td>
</tr>

<tr>
<th>औषधि</th>
<td id="medAdult"></td>
<td id="medYoung"></td>
<td id="medTotal"></td>
</tr>

<tr class="group">
<th>कुल खर्च</th>
<td id="expAdult"></td>
<td id="expYoung"></td>
<td id="expTotal"></td>
</tr>
</table>
</div>

</div>

<div class="footer-note">
📌 यो समरी उत्पादन, बिक्री तथा दाना–औषधि मोड्युलबाट स्वतः गणना गरिएको हो ।
</div>

<div class="no-print" style="text-align:center;margin-top:10px">
<button onclick="window.print()">🖨️ Print / Save PDF</button>
</div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

  const p = JSON.parse(localStorage.getItem("productionSalesPlan") || "{}");
  if(!p.adult){
    alert("पहिले production.html मा Save & Calculate गर्नुहोस्");
    return;
  }

  /* ===== BASIC COUNTS ===== */
  const adult = p.adult;
  const alive = adult * (p.breedRate/100) * p.kids * ((100-p.death)/100);
  const male  = alive * (p.maleRate/100);
  const female= alive - male;
  const keepF = female * (p.keepFemale/100);
  const keepM = male * (p.keepMale/100);

  const sellYoung = alive - keepF - keepM;
  const sellAdult = adult * (p.replacement/100);

  /* ===== SALES ===== */
  const wYoung = Number(localStorage.getItem("wYoung") || 80);
  const wAdult = Number(localStorage.getItem("wAdult") || 100);
  const priceKg= Number(localStorage.getItem("priceKg")|| 450);

  const incYoung = sellYoung * wYoung * priceKg;
  const incAdult = sellAdult * wAdult * priceKg;
  const incTotal = incYoung + incAdult;

  /* ===== EXPENSE ===== */
  const feedPrice = Number(localStorage.getItem("feedPrice") || 55);

  const feedAdult = adult * 3 * 365 * feedPrice;
  const feedYoung = alive * ((1.5*150)+(2*90)+(3*125)) * feedPrice;
  const feedTotal = feedAdult + feedYoung;

  const vitAdult = adult * 5 * 365;
  const vitYoung = alive * 8 * 365;
  const vitTotal = vitAdult + vitYoung;

  const medAdult = adult * 1500;
  const medYoung = alive * 2500;
  const medTotal = medAdult + medYoung;

  const expAdult = feedAdult + vitAdult + medAdult;
  const expYoung = feedYoung + vitYoung + medYoung;
  const expTotal = expAdult + expYoung;

  const ru = v => "रु " + Math.round(v).toLocaleString();

  document.getElementById("incYoung").textContent = ru(incYoung);
  document.getElementById("incAdult").textContent = ru(incAdult);
  document.getElementById("incTotal").textContent = ru(incTotal);

  document.getElementById("feedAdult").textContent = ru(feedAdult);
  document.getElementById("feedYoung").textContent = ru(feedYoung);
  document.getElementById("feedTotal").textContent = ru(feedTotal);

  document.getElementById("vitAdult").textContent = ru(vitAdult);
  document.getElementById("vitYoung").textContent = ru(vitYoung);
  document.getElementById("vitTotal").textContent = ru(vitTotal);

  document.getElementById("medAdult").textContent = ru(medAdult);
  document.getElementById("medYoung").textContent = ru(medYoung);
  document.getElementById("medTotal").textContent = ru(medTotal);

  document.getElementById("expAdult").textContent = ru(expAdult);
  document.getElementById("expYoung").textContent = ru(expYoung);
  document.getElementById("expTotal").textContent = ru(expTotal);

});
</script>

</body>
</html>
