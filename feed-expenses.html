<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>दाना तथा औषधि खर्च (प्रतिदिन आधार)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  font-family:"Noto Sans Devanagari","Kalimati",system-ui;
  background:#f4f7f6;
  margin:0;
}
.container{
  max-width:950px;
  margin:20px auto;
  background:#fff;
  padding:25px;
  border-radius:10px;
}
h1{color:#2e7d32;text-align:center}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
th,td{
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
}
th{background:#eef5ee}
input{
  width:100%;
  padding:6px;
}
button{
  margin-top:15px;
  padding:10px 18px;
  background:#2e7d32;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.note{
  font-size:13px;
  color:#555;
  margin-top:8px;
}
@media print{
  button{display:none}
}
</style>
</head>

<body>
<div class="container">

<h1>🐷 दाना खर्च (प्रतिदिन–प्रतिजनावर)</h1>

<table>
<tr><th colspan="2">जनावर संख्या</th></tr>
<tr><td>बयस्क (माउ)</td><td><input id="adultCount"></td></tr>
<tr><td>पाठापाठी (वार्षिक)</td><td><input id="youngCount"></td></tr>

<tr><th colspan="2">दाना मूल्य</th></tr>
<tr><td>दाना मूल्य (रु / केजी)</td><td><input id="feedPrice" value="55"></td></tr>
</table>

<button onclick="calculate()">📊 Calculate Feed Cost</button>

<div class="note">
📌 Feeding Logic:
बयस्क = 3kg/day | पाठापाठी: 0–5m = 1.5kg, 5–8m = 2kg, 9–12m = 3kg
</div>

<div id="result"></div>

</div>

<script>
function n(id){
  return parseFloat(document.getElementById(id).value) || 0;
}

/* Auto load from production.html (READ ONLY) */
const saved = localStorage.getItem("productionSalesPlan");
if(saved){
  const d = JSON.parse(saved);
  const adult = d.adult || 0;
  const alive =
    adult *
    (d.breedRate/100) *
    d.kids *
    ((100 - d.death)/100);

  document.getElementById("adultCount").value = Math.round(adult);
  document.getElementById("youngCount").value = Math.round(alive);
}

function calculate(){
  const adultCount = n("adultCount");
  const youngCount = n("youngCount");
  const price = n("feedPrice");

  /* Adult Feed */
  const adultKg = 3 * 365;
  const adultFeedCost = adultCount * adultKg * price;

  /* Young Feed (stage wise) */
  const youngKgPerAnimal =
      (1.5 * 150) +
      (2.0 * 90) +
      (3.0 * 125);

  const youngFeedCost =
      youngCount * youngKgPerAnimal * price;

  const totalFeed = adultFeedCost + youngFeedCost;

  document.getElementById("result").innerHTML = `
    <h3 style="margin-top:25px;color:#2e7d32">📌 वार्षिक दाना खर्च विवरण</h3>
    <table>
      <tr>
        <td>बयस्क दाना (kg/वर्ष)</td>
        <td>${(adultCount * adultKg).toLocaleString()}</td>
      </tr>
      <tr>
        <td>बयस्क दाना खर्च</td>
        <td>रु ${adultFeedCost.toLocaleString()}</td>
      </tr>

      <tr>
        <td>पाठापाठी दाना (kg/वर्ष)</td>
        <td>${(youngCount * youngKgPerAnimal).toLocaleString()}</td>
      </tr>
      <tr>
        <td>पाठापाठी दाना खर्च</td>
        <td>रु ${youngFeedCost.toLocaleString()}</td>
      </tr>

      <tr style="background:#dcedc8">
        <th>🔰 कुल वार्षिक दाना खर्च</th>
        <th>रु ${totalFeed.toLocaleString()}</th>
      </tr>
    </table>
  `;
}
</script>

</body>
</html>
