<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Income | FarmerBase BP Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:system-ui;background:#f4f6f8;margin:0}
header{background:#2e7d32;color:#fff;padding:14px 16px;
display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:18px}
.container{max-width:1100px;margin:auto;padding:16px;padding-bottom:140px}
.card{background:#fff;border-radius:10px;padding:16px;margin-bottom:16px}
label{font-weight:600;display:block;margin-top:10px}
input,select,textarea{
  width:100%;padding:8px;margin-top:6px;
  border:1px solid #ccc;border-radius:6px
}
button{cursor:pointer}
.btn{background:#2e7d32;color:#fff;border:none;padding:8px 12px;border-radius:6px}
.btn-red{background:#c62828;color:#fff;border:none;padding:6px 10px;border-radius:6px}
.small{font-size:13px;color:#555}
.nav{display:flex;justify-content:space-between;margin:12px 0}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ccc;padding:6px;font-size:14px}
th{background:#f1f8f4}
footer{
  position:fixed;left:0;right:0;bottom:0;
  background:#f1f8f4;border-top:1px solid #ccc;
  padding:8px 12px;display:flex;justify-content:space-between
}
</style>
</head>

<body>

<header>
  <h1>Income</h1>
  <button onclick="location.href='short-info.html'">🏠 Home</button>
</header>

<div class="container">

<div class="nav">
  <button onclick="location.href='capital-source.html'">⬅️ Capital</button>
  <button onclick="location.href='profit-loss.html'">➡️ Profit / Loss</button>
</div>

<!-- ADD INCOME -->
<div class="card">
<h2>➕ आम्दानी विवरण</h2>

<label>उत्पादन</label>
<select id="productSelect"></select>

<label>इकाई</label>
<input id="unit" placeholder="जस्तै: kg, वटा">

<label>परिमाण</label>
<input type="number" id="qty">

<label>दर</label>
<input type="number" id="rate">

<label>कैफियत / न्यारेसन</label>
<textarea id="note"></textarea>

<button class="btn" onclick="addIncome()">💾 आम्दानी थप्नुहोस्</button>
</div>

<!-- LIST -->
<div class="card">
<h2>📄 आम्दानी सूची</h2>
<div id="listBox"></div>
</div>

</div>

<footer>
<span class="small">Income</span>
<span class="small">FarmerBase BP Engine</span>
</footer>

<script>
/* ===== PRODUCTS ===== */
const products = JSON.parse(localStorage.getItem("fb_products")) || [];
function renderProducts(){
  productSelect.innerHTML="";
  products.forEach(p=>{
    const o=document.createElement("option");
    o.value=p.name;
    o.textContent=p.name;
    productSelect.appendChild(o);
  });
}
renderProducts();

/* ===== INCOME DATA ===== */
let incomes = JSON.parse(localStorage.getItem("fb_income")) || [];

/* ===== ADD INCOME ===== */
function addIncome(){
  const i = {
    product: productSelect.value,
    unit: unit.value.trim(),
    qty: Number(qty.value),
    rate: Number(rate.value),
    note: note.value.trim()
  };

  if(!i.product || !i.qty || !i.rate){
    alert("उत्पादन, परिमाण र दर आवश्यक");
    return;
  }

  incomes.push(i);
  localStorage.setItem("fb_income", JSON.stringify(incomes));

  clearForm();
  render();
}

/* ===== RENDER ===== */
function render(){
  if(!incomes.length){
    listBox.innerHTML="अहिलेसम्म आम्दानी छैन।";
    return;
  }

  let total=0;
  let html="<table><tr><th>उत्पादन</th><th>परिमाण</th><th>दर</th><th>रकम</th></tr>";

  incomes.forEach(i=>{
    const amt = i.qty * i.rate;
    total += amt;
    html += `
      <tr>
        <td>${i.product}</td>
        <td>${i.qty} ${i.unit}</td>
        <td>${i.rate}</td>
        <td>${amt.toLocaleString()}</td>
      </tr>
    `;
  });

  html += `
    <tr>
      <th colspan="3">कुल आम्दानी</th>
      <th>${total.toLocaleString()}</th>
    </tr>
  </table>`;

  listBox.innerHTML = html;
}

function clearForm(){
  unit.value="";
  qty.value="";
  rate.value="";
  note.value="";
}

render();
</script>

</body>
</html>
