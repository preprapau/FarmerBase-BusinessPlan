<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Capital Source | FarmerBase BP Engine</title>
<style>
body{font-family:Arial;background:#f6f7fb;padding:20px}
h2{margin-top:0}
.card{background:#fff;padding:20px;border-radius:8px;margin-bottom:20px}
input,select{width:100%;padding:8px;margin:5px 0}
button{padding:8px 14px;background:#2e7d32;color:#fff;border:none;border-radius:5px;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
.warn{color:red;font-weight:bold}
</style>
</head>

<body>

<h2>💰 Capital Source</h2>

<!-- SUMMARY -->
<div class="card">
  <b>पुँजी आवश्यकता सारांश</b><br>
  चालु पुँजी: <span id="runCap">0</span><br>
  स्थिर पुँजी: <span id="fixCap">0</span><br>
  कुल पुँजी: <span id="totalCap">0</span>
</div>

<!-- ADD SOURCE -->
<div class="card">
  <h3>➕ पुँजी स्रोत थप्नुहोस्</h3>

  <label>स्रोत प्रकार</label>
  <select id="srcType">
    <option>स्वलगानी</option>
    <option>बैंक ऋण</option>
    <option>अनुदान</option>
    <option>सहकारी</option>
    <option>अन्य</option>
  </select>

  <label>स्रोत नाम</label>
  <input id="srcName" placeholder="जस्तै: कृषि विकास बैंक">

  <label>कुन पुँजीका लागि?</label>
  <input type="checkbox" id="capRun"> चालु
  <input type="checkbox" id="capFix"> स्थिर

  <label>प्रतिशत (%)</label>
  <input type="number" id="percent" placeholder="जस्तै: 50">

  <button onclick="addSource()">Save Source</button>
</div>

<!-- LIST -->
<div class="card">
  <h3>📋 पुँजी स्रोत सूची</h3>
  <table>
    <thead>
      <tr>
        <th>स्रोत</th>
        <th>पुँजी प्रकार</th>
        <th>%</th>
        <th>रकम</th>
        <th>❌</th>
      </tr>
    </thead>
    <tbody id="list"></tbody>
  </table>
  <div id="warn" class="warn"></div>
</div>

<script>
/* LOAD EXPENSE TOTALS */
const expenses = JSON.parse(localStorage.getItem("fb_expenses")) || [];
let run=0, fix=0;
expenses.forEach(e=>{
  if(e.type==="चालु") run+=e.total;
  if(e.type==="स्थिर") fix+=e.total;
});
runCap.innerText=run;
fixCap.innerText=fix;
totalCap.innerText=run+fix;

/* ADD SOURCE */
function addSource(){
  const p = Number(percent.value);
  if(!p || p<=0 || p>100){
    alert("सही प्रतिशत हाल्नुहोस्");
    return;
  }

  let data = JSON.parse(localStorage.getItem("fb_capital_sources")) || [];

  if(capRun.checked){
    data.push({
      src:srcName.value,
      type:"चालु",
      percent:p,
      amount:Math.round(run*p/100)
    });
  }
  if(capFix.checked){
    data.push({
      src:srcName.value,
      type:"स्थिर",
      percent:p,
      amount:Math.round(fix*p/100)
    });
  }

  localStorage.setItem("fb_capital_sources",JSON.stringify(data));
  render();
}

/* RENDER LIST */
function render(){
  const data = JSON.parse(localStorage.getItem("fb_capital_sources")) || [];
  list.innerHTML="";
  let pr=0,pf=0;

  data.forEach((d,i)=>{
    if(d.type==="चालु") pr+=d.percent;
    if(d.type==="स्थिर") pf+=d.percent;

    list.innerHTML+=`
      <tr>
        <td>${d.src}</td>
        <td>${d.type}</td>
        <td>${d.percent}%</td>
        <td>${d.amount}</td>
        <td><button onclick="del(${i})">X</button></td>
      </tr>`;
  });

  warn.innerText="";
  if(pr!==100) warn.innerText+="⚠️ चालु पुँजी 100% छैन | ";
  if(pf!==100) warn.innerText+="⚠️ स्थिर पुँजी 100% छैन";
}

function del(i){
  let d=JSON.parse(localStorage.getItem("fb_capital_sources"));
  d.splice(i,1);
  localStorage.setItem("fb_capital_sources",JSON.stringify(d));
  render();
}

render();
</script>

</body>
</html>
