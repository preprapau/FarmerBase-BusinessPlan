<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Capital Test</title>
</head>

<body>

<h2>Capital Source TEST</h2>

<input id="capName" placeholder="Source name"><br><br>
<input id="capAmount" type="number" placeholder="Amount"><br><br>

<button type="button" onclick="addCapital()">Save Capital</button>

<hr>
<div id="out"></div>

<script>
console.log("SCRIPT LOADED");

function addCapital(){
  console.log("BUTTON CLICKED");

  const name = document.getElementById("capName").value;
  const amt  = Number(document.getElementById("capAmount").value);

  console.log("DATA:", name, amt);

  let caps = JSON.parse(localStorage.getItem("capitalSources")) || [];
  caps.push({source:name, amount:amt});

  localStorage.setItem("capitalSources", JSON.stringify(caps));

  render();
}

function render(){
  const caps = JSON.parse(localStorage.getItem("capitalSources")) || [];
  let html = "<pre>"+JSON.stringify(caps,null,2)+"</pre>";
  document.getElementById("out").innerHTML = html;
}

render();
</script>

</body>
</html>
