<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Capital Source | FarmerBase BP Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:system-ui;background:#f4f6f8;margin:0}
header{
  background:#2e7d32;color:#fff;
  padding:14px 16px;
  display:flex;justify-content:space-between;align-items:center
}
header h1{margin:0;font-size:18px}
.container{
  max-width:1100px;margin:auto;
  padding:16px;padding-bottom:140px
}
.card{
  background:#fff;border-radius:10px;
  padding:16px;margin-bottom:16px
}
h2{margin-top:0}
label{font-weight:600;display:block;margin-top:10px}
input,select,button{
  width:100%;padding:8px;margin-top:6px;
  border:1px solid #ccc;border-radius:6px
}
button{cursor:pointer}
.btn{background:#2e7d32;color:#fff;border:none}
.btn-red{background:#c62828;color:#fff;border:none}
.small{font-size:13px;color:#555}

.nav{display:flex;justify-content:space-between;margin:12px 0}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ccc;padding:6px;font-size:14px}
th{background:#f1f8f4}

footer{
  position:fixed;left:0;right:0;bottom:0;
  background:#f1f8f4;border-top:1px solid #ccc;
  padding:8px 12px;display:flex;justify-content:space-between
}
</style>
</head>

<body>

<header>
  <h1>Capital Source</h1>
  <button onclick="location.href='short-info.html'">🏠 Home</button>
</header>

<div class="container">

<!-- TOP NAV -->
<div class="nav">
  <button onclick="location.href='expenses.html'">⬅️ Expenses</button>
  <button id="nextBtn" onclick="location.href='income.html'">➡️ Next</button>
</div>

<!-- IDENTITY -->
<div class="card small">
  <b>संस्थाको नाम:</b> <span id="bizName"></span><br>
  <b>परियोजनाको नाम:</b> <span id="projectName"></span>
</div>

<!-- SUMMARY -->
<div class="card">
  <h2>📊 पुँजी आवश्यकता सारांश</h2>
  <div class="small">
    कुल पुँजी (चालु + स्थिर): <b id="totalCapital">0</b>
  </div>
</div>

<!-- ADD SOURCE -->
<div class="card">
  <h2>➕ पुँजी स्रोत थप्नुहोस्</h2>

  <label>स्रोत प्रकार</label>
  <select id="srcType">
    <option value="स्वलगानी">स्वलगानी</option>
    <option value="बैंक/सहकारी ऋण">बैंक/सहकारी ऋण</option>
    <option value="अनुदान">अनुदान</option>
    <option value="अन्य">अन्य</option>
  </select>

  <label>स्रोत नाम</label>
  <input id="srcName" placeholder="जस्तै: कृषि विकास बैंक">

  <label>प्रतिशत (%)</label>
  <input id="srcPct" type="number">

  <div id="loanBox" style="display:none">
    <label>ब्याजदर (%)</label>
    <input id="interestRate" type="number">
    <label>अवधि (वर्ष)</label>
    <input id="years" type="number">
  </div>

  <button class="btn" onclick="addSource()">💾 स्रोत थप्नुहोस्</button>
</div>

<!-- LIST -->
<div class="card">
  <h2>📄 पुँजी स्रोत सूची</h2>
  <div id="listBox"></div>
</div>

<!-- BOTTOM NAV -->
<div class="nav">
  <button onclick="location.href='expenses.html'">⬅️ Expenses</button>
  <button id="nextBtn2" onclick="location.href='income.html'">➡️ Next</button>
</div>

</div>

<footer>
  <span class="small">Capital Source</span>
  <span class="small">FarmerBase BP Engine</span>
</footer>

<script>
/* ===== IDENTITY ===== */
const login = JSON.parse(localStorage.getItem("fb_login")) || {};
bizName.innerText = login.businessName || "-";
projectName.innerText = login.projectName || "-";

/* ===== TOTAL CAPITAL FROM EXPENSES ===== */
const expenses = JSON.parse(localStorage.getItem("fb_expenses")) || [];
const totalCap = expenses.reduce((s,e)=>s+(e.qty*e.rate),0);
totalCapital.innerText = totalCap;

/* ===== DATA ===== */
let sources = JSON.parse(localStorage.getItem("fb_capital_source")) || [];
let editIndex=-1;

/* ===== LOAN TOGGLE ===== */
srcType.onchange=()=>{
  loanBox.style.display = srcType.value.includes("ऋण")?"block":"none";
};

/* ===== ADD SOURCE ===== */
function addSource(){
  const pct = +srcPct.value;
  if(!srcName.value || !pct){
    alert("स्रोत नाम र प्रतिशत आवश्यक छन्");
    return;
  }

  const s={
    type:srcType.value,
    name:srcName.value,
    pct,
    amount: Math.round(totalCap * pct / 100),
    rate: interestRate.value || 0,
    years: years.value || 0
  };

  if(editIndex>-1){
    sources[editIndex]=s;
    editIndex=-1;
  }else{
    sources.push(s);
  }

  localStorage.setItem("fb_capital_source", JSON.stringify(sources));
  clearForm();
  render();
}

/* ===== RENDER ===== */
function render(){
  if(!sources.length){
    listBox.innerHTML="अहिलेसम्म कुनै पुँजी स्रोत थपिएको छैन।";
    toggleNext();
    return;
  }

  let sumPct = sources.reduce((s,x)=>s+Number(x.pct),0);
  let html="<table><tr><th>स्रोत</th><th>%</th><th>रकम</th><th>ब्याज</th><th></th></tr>";
  sources.forEach((s,i)=>{
    html+=`
      <tr>
        <td>${s.name} (${s.type})</td>
        <td>${s.pct}</td>
        <td>${s.amount}</td>
        <td>${s.rate? s.rate+"% / "+s.years+" वर्ष": "-"}</td>
        <td>
          <button class="btn" onclick="editSrc(${i})">✏️</button>
          <button class="btn-red" onclick="delSrc(${i})">🗑️</button>
        </td>
      </tr>
    `;
  });
  html+="</table>";
  html+=`<div class="small">कुल प्रतिशत: <b>${sumPct}%</b></div>`;
  listBox.innerHTML=html;

  toggleNext(sumPct===100);
}

/* ===== NEXT ENABLE ===== */
function toggleNext(ok=false){
  nextBtn.disabled = nextBtn2.disabled = !ok;
  nextBtn.style.opacity = nextBtn2.style.opacity = ok?1:0.4;
}

/* ===== EDIT / DELETE ===== */
function editSrc(i){
  const s=sources[i];
  srcType.value=s.type;
  srcName.value=s.name;
  srcPct.value=s.pct;
  interestRate.value=s.rate;
  years.value=s.years;
  srcType.onchange();
  editIndex=i;
}
function delSrc(i){
  if(!confirm("यो स्रोत हटाउने?"))return;
  sources.splice(i,1);
  localStorage.setItem("fb_capital_source", JSON.stringify(sources));
  render();
}

/* ===== CLEAR ===== */
function clearForm(){
  srcName.value="";srcPct.value="";
  interestRate.value="";years.value="";
  srcType.value="स्वलगानी";
  srcType.onchange();
}

render();
</script>

</body>
</html>
