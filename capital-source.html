<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Capital Source | FarmerBase BP Engine</title>
<style>
body{font-family:Arial;background:#f5f7fa;margin:0;padding:15px}
h2,h3{margin-top:10px}
.card{background:#fff;padding:15px;border-radius:6px;margin-bottom:15px}
input,select{width:100%;padding:8px;margin:5px 0}
button{padding:8px 14px;border:none;border-radius:4px;background:#2e7d32;color:#fff;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
.warn{color:red;font-weight:bold}
</style>
</head>

<body>

<h2>💰 Capital Source</h2>

<div class="card">
<b>पुँजी आवश्यकता</b><br>
चालु: <span id="runCap">0</span><br>
स्थिर: <span id="fixCap">0</span><br>
कुल: <span id="totalCap">0</span>
</div>

<div class="card">
<h3>➕ पुँजी स्रोत</h3>

<label>स्रोत प्रकार</label>
<select id="srcType" onchange="toggleLoan()">
  <option>स्वलगानी</option>
  <option>ऋण</option>
  <option>सहकारी</option>
  <option>अनुदान</option>
</select>

<label>स्रोत नाम</label>
<input id="srcName">

<label>कुन पुँजीका लागि?</label>
<select id="capFor">
  <option value="चालु">चालु</option>
  <option value="स्थिर">स्थिर</option>
  <option value="दुवै">दुवै</option>
</select>

<label>प्रतिशत (%)</label>
<input type="number" id="percent">

<div id="loanBox" style="display:none">
<label>ब्याजदर (%)</label>
<input id="interest" type="number">
<label>अवधि (वर्ष)</label>
<input id="years" type="number">
</div>

<button onclick="saveSource()">Save</button>
</div>

<div class="card">
<h3>📋 स्रोत सूची</h3>
<table>
<thead>
<tr>
<th>नाम</th><th>प्रकार</th><th>लागि</th><th>%</th><th>रकम</th><th>ब्याज</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>

<p id="warn" class="warn"></p>
</div>

<div class="card">
<h3>📝 Auto Narration</h3>
<p id="narration"></p>
</div>

<button id="nextBtn" disabled onclick="location.href='income.html'">➡️ Next</button>

<script>
/* ===== LOAD EXPENSE TOTAL ===== */
const expenses = JSON.parse(localStorage.getItem("expenses"))||[];
let run=0, fix=0;
expenses.forEach(e=>{
  const a=Number(e.amount||e.total||0);
  if(e.type==="चालु") run+=a;
  if(e.type==="स्थिर") fix+=a;
});
runCap.innerText=run;
fixCap.innerText=fix;
totalCap.innerText=run+fix;

/* ===== DATA ===== */
let sources=JSON.parse(localStorage.getItem("capitalSources"))||[];

/* ===== TOGGLE LOAN ===== */
function toggleLoan(){
  loanBox.style.display = (srcType.value==="ऋण"||srcType.value==="सहकारी")?"block":"none";
}

/* ===== SAVE SOURCE ===== */
function saveSource(){
  const p=Number(percent.value);
  if(!srcName.value||p<=0){alert("सबै विवरण भर्नुहोस्");return;}

  let base = capFor.value==="चालु"?run:
             capFor.value==="स्थिर"?fix:
             run+fix;

  let amt = Math.round(base*p/100);
  let intr = srcType.value==="ऋण"||srcType.value==="सहकारी"
    ? Math.round(amt*(Number(interest.value||0)/100))
    : 0;

  sources.push({
    name:srcName.value,
    type:srcType.value,
    forCap:capFor.value,
    percent:p,
    amount:amt,
    interest:intr
  });

  localStorage.setItem("capitalSources",JSON.stringify(sources));
  render();
}

/* ===== RENDER ===== */
function render(){
  list.innerHTML="";
  let runP=0, fixP=0;
  let narr=[];
  let totalInterest=0;

  sources.forEach(s=>{
    list.innerHTML+=`
    <tr>
      <td>${s.name}</td><td>${s.type}</td><td>${s.forCap}</td>
      <td>${s.percent}%</td><td>${s.amount}</td><td>${s.interest}</td>
    </tr>`;
    if(s.forCap==="चालु") runP+=s.percent;
    if(s.forCap==="स्थिर") fixP+=s.percent;
    if(s.forCap==="दुवै"){runP+=s.percent;fixP+=s.percent;}
    narr.push(${s.percent}% ${s.name});
    totalInterest+=s.interest;
  });

  warn.innerText="";
  nextBtn.disabled=true;

  if(runP!==100) warn.innerText+="⚠ चालु पुँजी 100% छैन । ";
  if(fixP!==100) warn.innerText+="⚠ स्थिर पुँजी 100% छैन ।";

  if(runP===100 && fixP===100){
    nextBtn.disabled=false;
    narration.innerText =
      कुल पुँजी रु. ${run+fix} मध्ये ${narr.join(" र ")} बाट व्यवस्थापन गरिएको छ।;
    localStorage.setItem("capitalInterest", totalInterest);
  }
}
render();
</script>

</body>
</html>
