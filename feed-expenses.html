<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>दाना, भिटामिन तथा औषधि खर्च</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  font-family:"Noto Sans Devanagari","Kalimati",system-ui;
  background:#f4f7f6;
  margin:0;
}
.container{
  max-width:1000px;
  margin:20px auto;
  background:#fff;
  padding:25px;
  border-radius:10px;
}
h1{color:#2e7d32;text-align:center}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
th,td{
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
}
th{background:#eef5ee}
input{
  width:100%;
  padding:6px;
}
button{
  margin-top:15px;
  padding:10px 18px;
  background:#2e7d32;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.note{
  font-size:13px;
  color:#555;
  margin-top:8px;
}
@media print{ button{display:none} }
</style>
</head>

<body>
<div class="container">

<h1>🐷 दाना, भिटामिन तथा औषधि खर्च</h1>

<table>
<tr><th colspan="2">जनावर संख्या</th></tr>
<tr><td>बयस्क</td><td><input id="adultCount"></td></tr>
<tr><td>पाठापाठी (वार्षिक)</td><td><input id="youngCount"></td></tr>

<tr><th colspan="2">दाना</th></tr>
<tr><td>दाना मूल्य (रु / केजी)</td><td><input id="feedPrice" value="55"></td></tr>

<tr><th colspan="2">भिटामिन (रु / दिन / जनावर)</th></tr>
<tr><td>बयस्क</td><td><input id="vitAdult" value="5"></td></tr>
<tr><td>पाठापाठी</td><td><input id="vitYoung" value="8"></td></tr>

<tr><th colspan="2">औषधि (रु / वर्ष / जनावर)</th></tr>
<tr><td>बयस्क</td><td><input id="medAdult" value="1500"></td></tr>
<tr><td>पाठापाठी</td><td><input id="medYoung" value="2500"></td></tr>
</table>

<button onclick="calculate()">📊 Calculate Total Expense</button>

<div class="note">
📌 दाना = प्रतिदिन / stage-wise  
📌 भिटामिन = प्रतिदिन  
📌 औषधि = वार्षिक
</div>

<div id="result"></div>

</div>

<script>
function n(id){ return parseFloat(document.getElementById(id).value)||0; }

/* Load from production.html (READ ONLY) */
const saved = localStorage.getItem("productionSalesPlan");
if(saved){
  const d = JSON.parse(saved);
  const adult = d.adult || 0;
  const alive =
    adult *
    (d.breedRate/100) *
    d.kids *
    ((100-d.death)/100);

  document.getElementById("adultCount").value = Math.round(adult);
  document.getElementById("youngCount").value = Math.round(alive);
}

function calculate(){
  const adult = n("adultCount");
  const young = n("youngCount");
  const price = n("feedPrice");

  /* Feed */
  const adultKg = 3 * 365;
  const youngKg =
    (1.5*150)+(2*90)+(3*125);

  const feedAdult = adult * adultKg * price;
  const feedYoung = young * youngKg * price;
  const feedTotal = feedAdult + feedYoung;

  /* Vitamin */
  const vitTotal =
    (adult * n("vitAdult") * 365) +
    (young * n("vitYoung") * 365);

  /* Medicine */
  const medTotal =
    (adult * n("medAdult")) +
    (young * n("medYoung"));

  const grand = feedTotal + vitTotal + medTotal;

  document.getElementById("result").innerHTML = `
  <h3 style="margin-top:25px;color:#2e7d32">📌 वार्षिक खर्च सारांश</h3>
  <table>
    <tr><td>कुल दाना खर्च</td><td>रु ${feedTotal.toLocaleString()}</td></tr>
    <tr><td>कुल भिटामिन खर्च</td><td>रु ${vitTotal.toLocaleString()}</td></tr>
    <tr><td>कुल औषधि खर्च</td><td>रु ${medTotal.toLocaleString()}</td></tr>
    <tr style="background:#dcedc8">
      <th>🔰 कुल वार्षिक खर्च</th>
      <th>रु ${grand.toLocaleString()}</th>
    </tr>
  </table>`;
}
</script>

</body>
</html>
