<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Login | FarmerBase BP Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:system-ui;
  background:#f4f6f8;
  margin:0;
}
.header{
  background:#2e7d32;
  color:#fff;
  padding:24px 16px;
  text-align:center;
}
.header h1{margin:0;font-size:24px}
.header p{margin:8px 0 0;font-size:15px}

.container{
  max-width:600px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:#fff;
  border-radius:10px;
  padding:24px;
}

label{
  font-weight:600;
  display:block;
  margin-top:16px;
}
input{
  width:100%;
  padding:10px;
  margin-top:6px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

button{
  margin-top:24px;
  width:100%;
  padding:14px;
  font-size:17px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.green{
  background:#2e7d32;
  color:#fff;
}

.note{
  font-size:14px;
  color:#555;
  margin-top:14px;
  line-height:1.6;
}
.footer{
  text-align:center;
  font-size:14px;
  color:#555;
  margin:30px 0;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <h1>FarmerBase BP Engine</h1>
  <p>व्यवसायिक योजनाको डिजिटल प्रवेशद्वार</p>
</div>

<div class="container">

  <div class="card">
    <h2>व्यवसाय / परियोजना विवरण</h2>

    <label>संस्थाको / व्यवसायको नाम</label>
    <input id="businessName" placeholder="जस्तै: कालिका तरकारी फार्म">

    <label>परियोजनाको नाम</label>
    <input id="projectName" placeholder="जस्तै: तरकारी व्यवसाय योजना">

    <label>प्रोप्राइटरको नाम</label>
    <input id="ownerName" placeholder="तपाईंको नाम">

    <button class="green" onclick="saveLogin()">
      🔐 प्रवेश गर्नुहोस्
    </button>

    <div class="note">
      नोट: यो विवरण प्रस्तावका सबै पेज,
      पत्र र कभरमा स्वतः प्रयोग हुन्छ।
    </div>
  </div>

</div>

<div class="footer">
  FarmerBase BP Engine • Concept Development by Prem Prasad Paudel
</div>

<script>
function saveLogin(){
  const businessName = document.getElementById("businessName").value.trim();
  const projectName  = document.getElementById("projectName").value.trim();
  const ownerName    = document.getElementById("ownerName").value.trim();

  if(!businessName || !projectName || !ownerName){
    alert("सबै विवरण अनिवार्य छन्");
    return;
  }

  const loginData = {
    businessName,
    projectName,
    ownerName,
    time: new Date().toISOString()
  };

  localStorage.setItem("fb_login", JSON.stringify(loginData));

  // Go to main home
  location.href = "short-info.html";
}

// Auto-fill if already exists
const saved = JSON.parse(localStorage.getItem("fb_login"));
if(saved){
  businessName.value = saved.businessName || "";
  projectName.value  = saved.projectName || "";
  ownerName.value    = saved.ownerName || "";
}
</script>

</body>
</html>
